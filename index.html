<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More Sins Are Coming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0611;
    --bg-mid: #241333;
    --cream: #f3ecdf;
    --lavender: #c3b7dd;
    --lavender-dim: #9c8fb8;
    --line: rgba(243, 236, 223, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(ellipse 120% 90% at 50% 15%, var(--bg-mid) 0%, var(--bg-deep) 65%),
      var(--bg-deep);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 720px;
    text-align: center;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height: 1.08;
    margin: 0 0 28px;
    color: var(--cream);
    letter-spacing: -0.01em;
  }

  .tagline {
    font-size: clamp(1rem, 2.3vw, 1.25rem);
    color: var(--lavender);
    font-weight: 400;
    margin: 0 0 56px;
    line-height: 1.5;
  }

  form {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 22px;
    gap: 16px;
  }

  input[type="email"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--cream);
    padding: 10px 0;
    min-width: 0;
  }

  input[type="email"]::placeholder {
    color: var(--lavender-dim);
  }

  button {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--lavender);
    color: var(--lavender);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    padding: 12px 28px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  button:hover,
  button:focus-visible {
    background: var(--lavender);
    color: var(--bg-deep);
  }

  button:focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 2px;
  }

  .status {
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--lavender-dim);
    min-height: 1.2em;
  }

  @media (max-width: 480px) {
    form {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }
    button { width: 100%; }
    input[type="email"] { text-align: center; padding: 8px 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>More sins are coming.</h1>
    <p class="tagline">Leave your email. I'll find you when there's more to confess.</p>
    <form id="signup-form">
      <input type="hidden" name="access_key" value="fad73789-4015-4282-bc64-0af2b4918f06">
      <input type="hidden" name="subject" value="New confession signup">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <input type="email" name="email" id="email" placeholder="your@email.com" required aria-label="Email address">
      <button type="submit" id="submit-btn">I'M IN</button>
    </form>
    <p class="status" id="status"></p>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      submitBtn.disabled = true;
      status.textContent = 'Sending...';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await res.json();

        if (result.success) {
          status.textContent = "Noted. We'll be in touch.";
          form.reset();
        } else {
          status.textContent = 'Something went wrong. Try again.';
        }
      } catch (err) {
        status.textContent = 'Something went wrong. Try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
